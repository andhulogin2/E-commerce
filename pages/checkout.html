<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — NovaCart</title>
<meta name="description" content="Complete your NovaCart purchase securely. Enter shipping address and choose payment method.">

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="checkout">

<!-- ============ HEADER & NAVIGATION ============ -->
<div id="site-header"></div>

<!-- ============ BREADCRUMBS ============ -->
<nav class="breadcrumbs-wrapper" aria-label="Breadcrumb">
  <div class="breadcrumbs">
    <div class="breadcrumb-item"><a href="../index.html" class="breadcrumb-link"><i class="fa-solid fa-house"></i> Home</a></div>
    <span class="breadcrumb-sep"><i class="fa-solid fa-chevron-right"></i></span>
    <div class="breadcrumb-item"><a href="cart.html" class="breadcrumb-link">Cart</a></div>
    <span class="breadcrumb-sep"><i class="fa-solid fa-chevron-right"></i></span>
    <div class="breadcrumb-item"><span class="breadcrumb-current">Checkout</span></div>
  </div>
</nav>

<main>
  <section class="checkout-section" id="checkoutSection">
    <div class="section-head" style="margin-bottom: 1.5rem; text-align: left; max-width: 100%;">
      <span class="eyebrow">Final Step</span>
      <h2>Checkout</h2>
    </div>

    <form id="checkoutForm">
      <div class="checkout-layout">
        <!-- LEFT COLUMN: FORM -->
        <div class="checkout-main">
          <!-- SHIPPING BLOCK -->
          <div class="checkout-block">
            <h3><i class="fa-solid fa-truck-ramp-box"></i> Shipping Address</h3>
            <div class="form-grid">
              <div class="form-group full-width">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-input" placeholder="Alex Morgan" required>
              </div>
              <div class="form-group full-width">
                <label for="emailAddr">Email Address</label>
                <input type="email" id="emailAddr" class="form-input" placeholder="alex.morgan@example.com" required>
              </div>
              <div class="form-group full-width">
                <label for="streetAddress">Street Address</label>
                <input type="text" id="streetAddress" class="form-input" placeholder="104 Nova Way, Suite 400" required>
              </div>
              <div class="form-group">
                <label for="cityName">City</label>
                <input type="text" id="cityName" class="form-input" placeholder="San Francisco" required>
              </div>
              <div class="form-group">
                <label for="stateName">State / Province</label>
                <input type="text" id="stateName" class="form-input" placeholder="California" required>
              </div>
              <div class="form-group">
                <label for="zipCode">ZIP / Postal Code</label>
                <input type="text" id="zipCode" class="form-input" placeholder="94107" required>
              </div>
              <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" class="form-input" placeholder="+1 (555) 234-5678" required>
              </div>
            </div>
          </div>

          <!-- PAYMENT BLOCK -->
          <div class="checkout-block">
            <h3><i class="fa-solid fa-credit-card"></i> Payment Method</h3>
            <div class="payment-methods-grid">
              <label class="payment-method-card selected">
                <input type="radio" name="paymentOption" value="card" checked>
                <i class="fa-solid fa-credit-card"></i>
                <span>Credit / Debit</span>
              </label>

              <label class="payment-method-card">
                <input type="radio" name="paymentOption" value="upi">
                <i class="fa-solid fa-qrcode"></i>
                <span>UPI / QR</span>
              </label>

              <label class="payment-method-card">
                <input type="radio" name="paymentOption" value="cod">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span>Cash on Delivery</span>
              </label>
            </div>

            <!-- CARD INPUTS -->
            <div class="payment-card-details" id="cardInputsGroup">
              <div class="form-grid">
                <div class="form-group full-width">
                  <label for="cardName">Name on Card</label>
                  <input type="text" id="cardName" class="form-input" placeholder="Alex Morgan">
                </div>
                <div class="form-group full-width">
                  <label for="cardNumber">Card Number</label>
                  <input type="text" id="cardNumber" class="form-input" placeholder="4242 •••• •••• 4242">
                </div>
                <div class="form-group">
                  <label for="cardExp">Expiry Date</label>
                  <input type="text" id="cardExp" class="form-input" placeholder="08 / 28">
                </div>
                <div class="form-group">
                  <label for="cardCvv">CVV Code</label>
                  <input type="password" id="cardCvv" class="form-input" placeholder="•••" maxlength="4">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN: SUMMARY -->
        <div class="checkout-summary">
          <div class="order-summary-card">
            <h3>Order Items</h3>

            <div style="display:flex; flex-direction:column; gap:1rem; margin-bottom:1.5rem;">
              <div style="display:flex; gap:0.8rem; align-items:center;">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" style="width:45px; height:45px; object-fit:cover; border-radius:8px;">
                <div style="flex:1;">
                  <div style="font-size:0.88rem; font-weight:600;">boAt Rockerz 450 Pro</div>
                  <span style="font-size:0.8rem; color:var(--text-muted);">1x · ₹1,499</span>
                </div>
              </div>

              <div style="display:flex; gap:0.8rem; align-items:center;">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" style="width:45px; height:45px; object-fit:cover; border-radius:8px;">
                <div style="flex:1;">
                  <div style="font-size:0.88rem; font-weight:600;">OnePlus Nord CE 4</div>
                  <span style="font-size:0.8rem; color:var(--text-muted);">1x · ₹24,999</span>
                </div>
              </div>

              <div style="display:flex; gap:0.8rem; align-items:center;">
                <img src="https://images.unsplash.com/photo-1575311373937-de4c8988e46e?w=500&auto=format&fit=crop&q=60" style="width:45px; height:45px; object-fit:cover; border-radius:8px;">
                <div style="flex:1;">
                  <div style="font-size:0.88rem; font-weight:600;">Noise Smartwatch</div>
                  <span style="font-size:0.8rem; color:var(--text-muted);">1x · ₹1,799</span>
                </div>
              </div>
            </div>

            <div class="summary-row">
              <span>Subtotal</span>
              <span>₹28,297</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span style="color:var(--secondary); font-weight:600;">FREE</span>
            </div>
            <div class="summary-row">
              <span>Tax (18% GST)</span>
              <span>₹5,093.46</span>
            </div>

            <div class="summary-row total">
              <span>Total</span>
              <span>₹33,390.46</span>
            </div>

            <button type="submit" class="btn btn-primary ripple" id="placeOrderBtn" style="width: 100%; justify-content: center; margin-top: 1.5rem;">
              Place Order <i class="fa-solid fa-check"></i>
            </button>
          </div>
        </div>
      </div>
    </form>
  </section>
</main>

<!-- ============ FOOTER ============ -->
<div id="site-footer"></div>

<script src="../js/script.js"></script>
</body>
</html>
