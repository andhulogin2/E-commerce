<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Shopping Cart — NovaCart</title>
<meta name="description" content="Review your shopping cart, manage quantities, apply discount codes, and proceed to checkout.">

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="cart">

<!-- ============ HEADER & NAVIGATION ============ -->
<div id="site-header"></div>

<!-- ============ BREADCRUMBS ============ -->
<nav class="breadcrumbs-wrapper" aria-label="Breadcrumb">
  <div class="breadcrumbs">
    <div class="breadcrumb-item"><a href="../index.html" class="breadcrumb-link"><i class="fa-solid fa-house"></i> Home</a></div>
    <span class="breadcrumb-sep"><i class="fa-solid fa-chevron-right"></i></span>
    <div class="breadcrumb-item"><span class="breadcrumb-current">Shopping Cart</span></div>
  </div>
</nav>

<main>
  <section class="cart-section">
    <div class="section-head" style="margin-bottom: 1.5rem; text-align: left; max-width: 100%;">
      <span class="eyebrow">Review Items</span>
      <h2>Shopping Cart</h2>
    </div>

    <div class="cart-layout">
      <!-- CART ITEMS LIST -->
      <div class="cart-items-list" id="cartItemsList">
        <div class="cart-item-card" data-price="189">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="Studio Wireless Headphones" class="cart-item-img">
          <div class="cart-item-info">
            <span class="cart-item-cat">Audio</span>
            <h4 class="cart-item-title">Studio Wireless Headphones</h4>
            <span class="cart-item-price">$189.00</span>
          </div>
          <div class="qty-stepper">
            <button class="qty-btn minus" aria-label="Decrease quantity"><i class="fa-solid fa-minus"></i></button>
            <span class="qty-val">1</span>
            <button class="qty-btn plus" aria-label="Increase quantity"><i class="fa-solid fa-plus"></i></button>
          </div>
          <button class="cart-item-remove" aria-label="Remove item"><i class="fa-solid fa-trash-can"></i></button>
        </div>

        <div class="cart-item-card" data-price="128">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" alt="Aero Runner Sneaker" class="cart-item-img">
          <div class="cart-item-info">
            <span class="cart-item-cat">Footwear</span>
            <h4 class="cart-item-title">Aero Runner Sneaker</h4>
            <span class="cart-item-price">$128.00</span>
          </div>
          <div class="qty-stepper">
            <button class="qty-btn minus" aria-label="Decrease quantity"><i class="fa-solid fa-minus"></i></button>
            <span class="qty-val">1</span>
            <button class="qty-btn plus" aria-label="Increase quantity"><i class="fa-solid fa-plus"></i></button>
          </div>
          <button class="cart-item-remove" aria-label="Remove item"><i class="fa-solid fa-trash-can"></i></button>
        </div>

        <div class="cart-item-card" data-price="96">
          <img src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=500&auto=format&fit=crop&q=60" alt="Minimalist Chrono Watch" class="cart-item-img">
          <div class="cart-item-info">
            <span class="cart-item-cat">Accessories</span>
            <h4 class="cart-item-title">Minimalist Chrono Watch</h4>
            <span class="cart-item-price">$96.00</span>
          </div>
          <div class="qty-stepper">
            <button class="qty-btn minus" aria-label="Decrease quantity"><i class="fa-solid fa-minus"></i></button>
            <span class="qty-val">1</span>
            <button class="qty-btn plus" aria-label="Increase quantity"><i class="fa-solid fa-plus"></i></button>
          </div>
          <button class="cart-item-remove" aria-label="Remove item"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      </div>

      <!-- ORDER SUMMARY SIDEBAR -->
      <div class="order-summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cartSubtotal">$413.00</span>
        </div>
        <div class="summary-row">
          <span>Estimated Shipping</span>
          <span id="cartShipping">FREE</span>
        </div>
        <div class="summary-row">
          <span>Estimated Tax (8%)</span>
          <span id="cartTax">$33.04</span>
        </div>

        <div class="promo-box">
          <input type="text" placeholder="Promo code (e.g. NOVA20)">
          <button class="btn btn-ghost" style="padding:0.65rem 1rem;">Apply</button>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="cartTotal">$446.04</span>
        </div>

        <a href="checkout.html" class="btn btn-primary ripple" id="checkoutBtn" style="width: 100%; justify-content: center; margin-top: 1.5rem;">
          Proceed to Checkout <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </section>
</main>

<!-- ============ FOOTER ============ -->
<div id="site-footer"></div>

<script src="../js/script.js"></script>
</body>
</html>
